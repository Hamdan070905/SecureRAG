name: Build SecureRAG
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Python executable
        run: |
          pip install pyinstaller
          pip install -r backend/requirements.txt --ignore-requires-python
          cd backend
          pyinstaller --onefile --name backend main.py
        shell: cmd

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install

      - name: Build Windows
        run: |
          cd frontend
          npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: frontend/dist-electron/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Python executable
        run: |
          pip3 install pyinstaller
          pip3 install -r backend/requirements.txt --ignore-requires-python
          cd backend
          pyinstaller --onefile --name backend main.py

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install

      - name: Build Mac
        run: |
          cd frontend
          npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: frontend/dist-electron/*.dmg
